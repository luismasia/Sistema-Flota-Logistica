{% extends 'base.html' %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{{ titulo }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const selectCiudad = document.getElementById("id_ciudad_origen");
        const inputProvincia = document.getElementById("id_provincia_origen");

        if (selectCiudad && selectCiudad.tagName === "SELECT") {
            selectCiudad.addEventListener("change", function() {
                const ciudadElegida = this.value;
                const mapaProvincias = JSON.parse(this.getAttribute("data-provincias") || "{}");
                
                if (ciudadElegida && mapaProvincias[ciudadElegida]) {
                    inputProvincia.value = mapaProvincias[ciudadElegida];
                } else {
                    inputProvincia.value = "";
                }
            });
        }
    });
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const inputCiudad = document.querySelector('[name="ciudad_origen"]');
    const selectChofer = document.querySelector('[name="chofer"]');

    if (inputCiudad && selectChofer) {
        function actualizarChoferes() {
            const ciudad = inputCiudad.value.trim();
            if (!ciudad) return;

            fetch(`{% url 'ajax_choferes_ciudad' %}?ciudad=${encodeURIComponent(ciudad)}`)
                .then(response => response.json())
                .then(data => {
                    selectChofer.innerHTML = '<option value="">---------</option>';
                    
                    if (data.choferes.length > 0) {
                        data.choferes.forEach(chofer => {
                            const option = document.createElement('option');
                            option.value = chofer.id;
                            option.textContent = chofer.texto;
                            selectChofer.appendChild(option);
                        });
                    } else {
                        selectChofer.innerHTML = '<option value="">No hay choferes disponibles en esta ciudad</option>';
                    }
                })
                .catch(error => console.error('Error AJAX al cargar choferes:', error));
        }
        inputCiudad.addEventListener('change', actualizarChoferes);
    }
});
</script>

{% endblock %}
