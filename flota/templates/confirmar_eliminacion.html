{% extends 'base.html' %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">{{ titulo_alerta|default:'Confirmar Eliminación' }}</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">
                    ¿Estás seguro de que querés eliminar el registro <strong>{{ object }}</strong>?
                </p>
                <div class="alert alert-warning small">
                    Esta acción no se puede deshacer y podría afectar a otros registros vinculados.
                </div>
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" id="next_url" value="">
                    <button type="submit" class="btn btn-danger px-4">Sí, Eliminar</button>
                    <a href="javascript:history.back()" class="btn btn-secondary px-4">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const anteriorUrl = document.referrer;
        const nextInput = document.getElementById("next_url");
        
        if (anteriorUrl && nextInput) {
            nextInput.value = anteriorUrl;
        }
    });
</script>
{% endblock %}
