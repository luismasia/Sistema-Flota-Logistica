{% extends 'base.html' %}

{% block contenido %}
<div class="container mt-4">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Sedes</h2>
        <div>
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Volver</a>
            <a href="{% url 'sede_create' %}" class="btn btn-primary">+ Nueva Sede</a>
        </div>
    </div>
    
    <div class="row">
        {% for sede in sedes %}
        <div class="col-md-3 mb-4">
            <a href="{% url 'sede_detail' sede.pk %}" class="text-decoration-none">
                <div class="card text-center border-success h-100 shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-center">
                        <p class="text-success mb-1"><small>Sede</small></p>
                        <h5 class="card-title text-success mb-0">{{ sede.ciudad }}</h5>
                    </div>
                </div>
            </a>
        </div>
        
        {% empty %}
        <div class="col-12">
            <div class="alert alert-warning text-center shadow-sm" role="alert">
                Aún no hay sedes registradas en el sistema.
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
