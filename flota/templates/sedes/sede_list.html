{% extends 'base.html' %}

{% block contenido %}
<div class="container mt-4">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Sedes</h2>
        <div>
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Volver</a>
            <a href="{% url 'sede_create' %}" class="btn btn-primary">+ Nueva Sede</a>
        </div>
    </div>
    
<div class="row">
    {% for sede in sedes %}
        <div class="col-md-3 mb-4">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-center">
                    <p class="text-muted mb-1"><small>Sede</small></p>
                    <h5 class="card-title mb-3">{{ sede.ciudad }}</h5>
                    <div class="mt-auto">
                        <a href="{% url 'sede_detail' sede.pk %}" class="btn btn-sm btn-outline-primary px-4">Ver sede</a>
                    </div>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12">
            <div class="alert alert-warning text-center shadow-sm" role="alert">
                Aún no hay sedes registradas en el sistema.
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
